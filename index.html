<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6658e8">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Coco Tchat</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      color-scheme: light;
      --primary: #6658e8; --primary-dark: #5144c8;
      --bg: #f4f5fb; --panel: #fff; --text: #22243a;
      --muted: #777b91; --border: #e8e9f2; --danger: #d83c56; --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    button, input, textarea, select { font: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    .topbar { min-height: 64px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--panel); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 850; font-size: 23px; color: var(--primary); }
    .brand span { color: var(--text); }
    .status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ba0b5; display: inline-block; }
    .dot.online { background: #2cb67d; }
    .app { max-width: 1450px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 225px minmax(0, 1fr) 240px; gap: 16px; min-height: calc(100vh - 64px); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .side { padding: 16px; }
    .section-title { font-size: 12px; font-weight: 800; letter-spacing: .8px; color: var(--muted); text-transform: uppercase; margin: 4px 0 12px; }
    .salon-list { display: grid; gap: 6px; }
    .salon-btn { width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--text); }
    .salon-btn:hover { background: #f3f1ff; }
    .salon-btn.active { background: #eeebff; color: var(--primary-dark); font-weight: 750; }
    .side-action { width: 100%; margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: white; text-align: left; }
    .chat { display: flex; flex-direction: column; min-height: 72vh; max-height: calc(100vh - 96px); }
    .chat-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; gap: 9px; align-items: flex-start; max-width: 95%; }
    .message.mine { align-self: flex-end; flex-direction: row-reverse; }
    .message.system { max-width: 100%; align-self: center; }
    .bubble { padding: 10px 12px; border-radius: 13px; background: #f1f2f8; line-height: 1.45; overflow-wrap: anywhere; }
    .mine .bubble { background: #eeebff; }
    .system .bubble { background: #f7f7fa; color: var(--muted); text-align: center; font-size: 12px; }
    .message-meta { display: flex; gap: 7px; margin-bottom: 5px; font-size: 12px; }
    .message-meta strong { color: var(--primary-dark); }
    .avatar { width: 34px; height: 34px; object-fit: cover; border-radius: 50%; background: #e9e7ff; }
    .media-preview { display: block; max-width: min(100%, 360px); max-height: 300px; border-radius: 10px; margin-top: 5px; }
    .composer { border-top: 1px solid var(--border); padding: 12px; }
    .composer-row { display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 150px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; outline: none; }
    .btn { border: 0; border-radius: 10px; padding: 11px 15px; background: var(--primary); color: white; font-weight: 700; }
    .btn:hover { background: var(--primary-dark); }
    .composer-extras { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .file-label { cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px; }
    .file-label input { display: none; }
    .user-list { display: grid; gap: 8px; }
    .user-card { padding: 9px; border: 1px solid var(--border); border-radius: 11px; display: flex; align-items: center; gap: 8px; }
    .user-card .user-name { font-size: 13px; font-weight: 700; }
    .user-card .user-sub { font-size: 11px; color: var(--muted); }
    .modal { position: fixed; inset: 0; background: #16152a99; padding: 16px; display: grid; place-items: center; z-index: 10; }
    .modal-card { width: min(100%, 480px); background: white; border-radius: 18px; padding: 24px; }
    .field { display: grid; gap: 6px; margin-bottom: 10px; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; }
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #25243a; color: white; padding: 12px 16px; border-radius: 12px; z-index: 30; font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Coco <span>Tchat</span></div>
    <div class="status">
      <span id="connectionDot" class="dot"></span>
      <span id="connectionText">Non connecté</span>
    </div>
  </header>

  <main class="app">
    <aside class="panel side">
      <div class="section-title">Les salons</div>
      <div id="salonList" class="salon-list"></div>

      <div style="margin-top:20px" class="section-title">⭐ Mes amis</div>
      <div id="friendsList" class="user-list" style="margin-bottom:12px;"></div>

      <div class="section-title">Communauté</div>
      <button id="adminPanelBtn" class="side-action hidden" type="button" style="background:#eeebff; color:#5144c8; font-weight:bold;">🛡️ Panneau Admin</button>
      <button id="feedbackBtn" class="side-action" type="button">💡 Donner mon avis</button>
      <button id="rulesBtn" class="side-action" type="button">📋 Règles du tchat</button>
      <button id="profileBtn" class="side-action" type="button">🖼️ Changer mon avatar</button>
      <button id="disconnectBtn" class="side-action hidden" type="button">↪ Se déconnecter</button>
    </aside>

    <section class="panel chat">
      <header class="chat-head">
        <div>
          <h1 id="chatTitle">💬 Général</h1>
          <p id="chatSubtitle">Les messages du salon apparaissent ici.</p>
        </div>
        <span id="onlineCount" class="count">0 en ligne</span>
      </header>

      <div id="notice" class="notice hidden"></div>
      <div id="messages" class="messages">
        <div class="empty">Connecte-toi pour rejoindre la discussion.</div>
      </div>

      <form id="composer" class="composer hidden">
        <div class="composer-row">
          <textarea id="messageInput" maxlength="1000" placeholder="Écris ton message… (tape @pseudo pour mentionner)"></textarea>
          <button id="sendBtn" class="btn" type="submit">Envoyer</button>
        </div>
        <div class="composer-extras">
          <label class="file-label">📎 Image/Vidéo<input id="mediaInput" type="file" accept="image/*,video/*"></label>
          <label class="file-label">📸 Photo<input id="cameraInput" type="file" accept="image/jpeg" capture="environment"></label>
          <button id="voiceBtn" type="button" class="file-label" style="background:none; border:0;">🎤 <span id="voiceText">Audio</span></button>
        </div>
      </form>
    </section>

    <aside class="panel side">
      <div class="section-title">Connectés</div>
      <div id="userList" class="user-list"></div>
    </aside>
  </main>

  <div id="loginModal" class="modal">
    <section class="modal-card">
      <h2>Bienvenue sur Coco Tchat 👋</h2>
      <form id="loginForm" class="form-grid">
        <div class="field"><label>Pseudo</label><input id="nickname" maxlength="16" required></div>
        <div class="field"><label>Âge</label><input id="age" type="number" min="18" max="99" required></div>
        <div class="field"><label>Clé de modération (admin)</label><input id="adminKey" type="password" placeholder="Laisse vide si non admin"></div>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFXj08CLWxiKawxa" style="margin: 8px 0;"></div>
        <label><input id="acceptRules" type="checkbox" required> J'ai 18 ans et j'accepte les règles.</label>
        <button class="btn" type="submit" style="width:100%; margin-top:10px;">Entrer</button>
      </form>
    </section>
  </div>

  <div id="toast" class="hidden"></div>

  <script>
    "use strict";
    const $ = id => document.getElementById(id);
    let socket = null, connected = false, myName = "", myId = "", currentSalon = "Général", onlineUsers = [], privateTarget = "";
    let friends = JSON.parse(localStorage.getItem("coco_friends") || "[]");
    let isAdmin = false;

    function toast(msg) {
      const el = $("toast"); el.textContent = msg; el.classList.remove("hidden");
      setTimeout(() => el.classList.add("hidden"), 3500);
    }

    function toggleFriend(name) {
      const idx = friends.indexOf(name);
      if (idx > -1) friends.splice(idx, 1); else friends.push(name);
      localStorage.setItem("coco_friends", JSON.stringify(friends));
      renderOnline();
    }

    function openSocket(profile) {
      if (socket) try { socket.close(); } catch {}
      socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);

      socket.addEventListener("open", () => {
        socket.send(JSON.stringify({ t: "join", ...profile, s: currentSalon }));
      });

      socket.addEventListener("message", (e) => {
        const msg = JSON.parse(e.data);
        if (msg.t === "init") {
          myName = msg.n; myId = msg.i;
          isAdmin = msg.admin === true;
          $("loginModal").classList.add("hidden");
          $("messages").replaceChildren();
          msg.hist.forEach(renderMessage);
          connected = true;
          $("composer").classList.remove("hidden");
          $("disconnectBtn").classList.remove("hidden");
          $("adminPanelBtn").classList.toggle("hidden", !isAdmin);
          toast("Bienvenue " + myName + " !");
        } else if (msg.t === "msg" || msg.t === "pm") {
          renderMessage(msg);
          if (msg.x && msg.x.includes("@" + myName)) {
            toast("💬 Vous avez été mentionné par " + msg.n);
            if (navigator.vibrate) navigator.vibrate(200);
          }
        } else if (msg.t === "online") {
          onlineUsers = msg.list;
          renderOnline();
        } else if (msg.t === "banned") {
          alert(msg.x);
          location.reload();
        }
      });
    }

    function renderMessage(msg) {
      const box = $("messages");
      const div = document.createElement("div");
      div.className = "message" + (msg.n === myName ? " mine" : "");
      
      let mediaHtml = "";
      if (msg.media && msg.media.id) {
        const url = "/media/" + msg.media.id;
        if (msg.media.k === "img") mediaHtml = `<img src="${url}" class="media-preview" loading="lazy">`;
        else if (msg.media.k === "vid") mediaHtml = `<video src="${url}" controls class="media-preview"></video>`;
        else if (msg.media.k === "aud") mediaHtml = `<audio src="${url}" controls class="media-preview"></audio>`;
      }

      div.innerHTML = `<div class="bubble"><div class="message-meta"><strong>${msg.n}</strong></div><div>${msg.x || ""}</div>${mediaHtml}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function renderOnline() {
      const list = $("userList");
      list.replaceChildren();
      onlineUsers.forEach(u => {
        if (u.n === myName) return;
        const card = document.createElement("div");
        card.className = "user-card";
        const isF = friends.includes(u.n);
        card.innerHTML = `<div style="min-width:0"><div class="user-name">${u.n}</div><div class="user-sub">${u.s}</div></div>
          <button onclick="toggleFriend('${u.n}')" style="margin-left:auto">${isF ? '★' : '☆'}</button>`;
        list.appendChild(card);
      });
    }

    $("adminPanelBtn").addEventListener("click", () => {
      const key = prompt("Entrez votre clé de modération pour ouvrir le panel :");
      if (key) {
        window.open("/admin?key=" + encodeURIComponent(key), "_blank");
      }
    });

    $("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const token = document.querySelector('[name="cf-turnstile-response"]')?.value || "";
      openSocket({
        n: $("nickname").value.trim(),
        a: $("age").value,
        adminKey: $("adminKey").value,
        token
      });
    });

    $("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("messageInput").value.trim();
      if (!text) return;
      socket.send(JSON.stringify({ t: privateTarget ? "pm" : "msg", to: privateTarget, x: text }));
      $("messageInput").value = "";
    });

    const salonsFallback = ["Général", "18-25 ans", "26-40 ans", "Musique", "Jeux vidéo", "Détente", "Avis & idées"];
    const sList = $("salonList");
    salonsFallback.forEach(s => {
      const btn = document.createElement("button");
      btn.className = "salon-btn" + (s === currentSalon ? " active" : "");
      btn.textContent = "💬 " + s;
      btn.onclick = () => {
        currentSalon = s;
        socket.send(JSON.stringify({ t: "salon", s }));
        document.querySelectorAll(".salon-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        $("chatTitle").textContent = "💬 " + s;
      };
      sList.appendChild(btn);
    });
  </script>
</body>
</html>
